name: Bug report
description: Report a reproducible problem with dsh-pixel-studio
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include credentials, tokens, or
        private artwork you cannot share. For security issues use SECURITY.md.
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: "0.2.1-rc.2"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: dsh-pixel-studio version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, Node version, DSH Web URL/port if relevant.
      placeholder: "Windows 11, Node 24, DSH desktop web"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ask/run ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the tool result, craft report, browser console errors, or manifest snippet.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, tool arguments (redact paths if needed), or a minimal grid.
    validations:
      required: false
